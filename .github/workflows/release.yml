name: Release

# main に入ったら各プラットフォーム向けにビルドし、GitHub Release に置く。
# 最新版は https://github.com/varu3/schemap/releases/latest/download/<ファイル名> で落とせる。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build frontend
        working-directory: internal/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # CGO を使っていないので、ubuntu の上で全プラットフォーム向けに作れる
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="schemap_${os}_${arch}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "build/$name/schemap$ext" .
            cp README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > checksums.txt)
          ls -l dist

      # ほかのアプリに組み込む形（画面と WASM）。組み込み先のビルドがこの tar を取り、中身をそのまま配る。
      # ローカルのビルド（internal/static/dist）とは別の場所に出すので、上のバイナリには入らない
      - name: Build hosted bundle
        run: |
          mkdir -p internal/frontend/public-hosted
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" \
            -o internal/frontend/public-hosted/schemap.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/frontend/public-hosted/
          (cd internal/frontend && pnpm run build:hosted)
          mkdir -p build
          cp -R internal/frontend/dist-hosted build/schemap_hosted
          tar -C build -czf dist/schemap_hosted.tar.gz schemap_hosted
          (cd dist && sha256sum -- schemap_* > checksums.txt)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # タグは vYYYYMMDD-N。N は workflow の実行番号
      - name: Create release
        run: |
          tag="v$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}"
          latest="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download"
          {
            echo "${GITHUB_SHA::7} からビルドしたもの。"
            echo
            echo "| プラットフォーム | この版 | 常に最新 |"
            echo "|---|---|---|"
            for f in dist/schemap_*; do
              n="$(basename "$f")"
              # 組み込み用の tar は、プラットフォームの表には出さない
              if [ "$n" = schemap_hosted.tar.gz ]; then continue; fi
              p="${n#schemap_}"
              p="${p%%.*}"
              echo "| ${p/_//} | [${n}](${base}/${n}) | [latest](${latest}/${n}) |"
            done
            echo
            echo "ほかのアプリに組み込む形（画面と WASM）: [schemap_hosted.tar.gz](${base}/schemap_hosted.tar.gz)"
            echo
            echo "チェックサム: [checksums.txt](${base}/checksums.txt)"
            echo
            echo '```bash'
            echo "gh release download '${tag}' -R ${GITHUB_REPOSITORY} -p 'schemap_darwin_arm64.tar.gz'"
            echo "tar -xzf schemap_darwin_arm64.tar.gz && ./schemap_darwin_arm64/schemap path/to/db/schema"
            echo '```'
          } > notes.md
          gh release create "$tag" dist/* \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            --latest

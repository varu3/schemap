name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # 画面をビルドして internal/static/dist に置く（go:generate と同じ処理）。embed のため Go のテストより先に要る
      - name: Frontend
        working-directory: internal/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build
          pnpm audit --audit-level high

      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      # ほかのアプリに組み込む形（WASM と hosted ビルド）も作れることを確かめる
      - name: Hosted
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
          mkdir -p internal/frontend/public-hosted
          GOOS=js GOARCH=wasm go build -o internal/frontend/public-hosted/schemap.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" internal/frontend/public-hosted/
          cd internal/frontend && pnpm run build:hosted
